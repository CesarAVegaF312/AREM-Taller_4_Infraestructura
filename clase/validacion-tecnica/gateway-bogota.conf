# API Gateway de Bogotá: envía las solicitudes al módulo de rutas de Bogotá.
server {
    listen 80;

    resolver 127.0.0.11 valid=5s;
    set $modulo_rutas http://rutas-bogota;

    location / {
        proxy_set_header X-Gateway "Bogota";
        proxy_connect_timeout 2s;
        proxy_pass $modulo_rutas;
    }
}
