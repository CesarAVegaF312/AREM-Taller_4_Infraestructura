# Balanceador de carga: reparte el tráfico de los clientes entre las regiones.
server {
    listen 80;

    # Consulta el DNS de Docker cada pocos segundos, para seguir encontrando
    # los componentes aunque se reinicien durante los experimentos.
    resolver 127.0.0.11 valid=5s;
    set $gateway_bogota   http://gateway-bogota;
    set $gateway_medellin http://gateway-medellin;

    location /bogota/ {
        rewrite ^/bogota/(.*)$ /$1 break;
        proxy_pass $gateway_bogota;
    }

    location /medellin/ {
        rewrite ^/medellin/(.*)$ /$1 break;
        proxy_pass $gateway_medellin;
    }
}
